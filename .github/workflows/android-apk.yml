# Builds an installable Android APK (signed with the debug key, for sideloading,
# not for the Play Store). Download it from the run's "Artifacts" section.
name: Android APK

on:
  push:
    branches: ['main', 'claude/*']
  workflow_dispatch:

# A newer push makes the running build obsolete.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Raise Gradle memory limits
        # The defaults written by prebuild (512 MB Metaspace) make KSP crash with
        # OutOfMemoryError: Metaspace, after which Gradle hangs until the timeout.
        # Later keys override earlier ones in gradle.properties.
        run: |
          cat >> android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
          org.gradle.workers.max=2
          PROPS

      - name: Build release APK
        working-directory: android
        # ARM only: covers real phones and tablets, and halves the build time.
        # Release lint checks are skipped: they are slow and not needed for a sideloaded APK.
        run: |
          cat > "$RUNNER_TEMP/no-lint.gradle" <<'GRADLE'
          allprojects {
            tasks.configureEach { task ->
              if (task.name.startsWith('lintVital')) task.enabled = false
            }
          }
          GRADLE
          # Temporary diagnostics: log every node call Gradle makes, with its
          # stderr, because Gradle hides the output of failing node commands.
          mkdir -p "$RUNNER_TEMP/nodewrap"
          REAL_NODE="$(command -v node)"
          cat > "$RUNNER_TEMP/nodewrap/node" <<WRAP
          #!/usr/bin/env bash
          echo "=== node \$* (cwd: \$PWD)" >> "$RUNNER_TEMP/node-calls.log"
          "$REAL_NODE" "\$@" 2> >(tee -a "$RUNNER_TEMP/node-calls.log" >&2)
          status=\$?
          echo "=== exit \$status" >> "$RUNNER_TEMP/node-calls.log"
          exit \$status
          WRAP
          chmod +x "$RUNNER_TEMP/nodewrap/node"
          export PATH="$RUNNER_TEMP/nodewrap:$PATH"
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -I "$RUNNER_TEMP/no-lint.gradle" \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            || { echo "----- node calls -----"; awk '/^=== node /{blk=$0; next} {blk=blk"\n"$0} /^=== exit [1-9]/{print blk}' "$RUNNER_TEMP/node-calls.log" | tail -80; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: cryohelper-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
