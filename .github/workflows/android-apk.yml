# Builds an installable Android APK (signed with the debug key, for sideloading,
# not for the Play Store). Download it from the run's "Artifacts" section.
name: Android APK

on:
  push:
    branches: ['main', 'claude/*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        # ARM only: covers real phones and tablets, and halves the build time.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cryohelper-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
